name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m coverage run -m pytest -q tests
      - run: python -m coverage combine
      - run: python -m coverage report
      - run: python -m ruff check agenthub tests examples
      - run: python -m lizard -C 10 -L 60 -a 6 -w agenthub tests examples
